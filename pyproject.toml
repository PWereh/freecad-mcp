[project]
name = "freecad-mcp"
version = "0.3.0"
description = "FreeCAD MCP bridge (stdio), v0.2.0 rebuild per the bridge contract BC-01..BC-08"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # OPEN: resolved 2026-09-17 by the user - mcp 2.2.0. The build declared
    # >=2.1.1,<3 while uv.lock had already resolved 2.2.0 and the blueprint text
    # said "pinned 2.1.1"; three statements, two of them wrong about what runs.
    # Pinned exactly so the declaration and the lock cannot drift apart again.
    "mcp[cli]==2.2.0",
    "validators>=0.34.0",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
